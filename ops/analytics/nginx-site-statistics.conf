# Place these directives inside the caizhidao.yrchr.com HTTPS server block.
access_log /var/log/caizhidao/access.log combined;

location = /site-statistics/summary.json {
    alias /var/lib/caizhidao/site-statistics/summary.json;
    access_log off;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
